    <script>
      // 首帧前根据持久化偏好挂 .dark，避免 SSG 静态页闪白/闪黑
      ;(function () {
        try {
          var s = localStorage.getItem('vueuse-color-scheme') || 'auto';
          var dark =
            s === 'dark' ||
            (s === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
